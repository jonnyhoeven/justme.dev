name: Deployment

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'GEMINI.md'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'GEMINI.md'
  workflow_dispatch:

# Scoped concurrency: cancel running PR builds but allow main branch builds to complete.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix & Setup Cache
        uses: DeterminateSystems/determinate-nix-action@v3

      - name: Install dependencies
        run: nix develop .#ci --command pnpm install

      - name: Lint
        run: nix develop .#ci --command pnpm run lint

      - name: Lint Python
        run: nix develop .#ci --command ruff check .

      - name: Run all tests
        run: nix develop .#ci --command pnpm run test:all

      - name: Generate content
        run: nix develop .#ci --command python3 scripts/process_requests.py

      - name: Build with VitePress
        run: nix develop .#ci --command pnpm run docs:build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .vitepress/dist

  # Deployment job
  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    name: Deploy
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
