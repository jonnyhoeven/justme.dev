name: Update flake.lock

on:
  schedule:
    - cron: '0 6 * * 1' # Weekly on Monday at 06:00 UTC (after the 03:00 deploy build)
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@4d65ea9cab522b6d9f29a170aed23ededc1b27af # v3.23.0

      # NOTE: PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so the
      # Deployment workflow (lint, tests, build) will NOT run on this PR automatically. To get CI on it,
      # pass a PAT or GitHub App token via the `token` input (not configured here), or close and
      # re-open the PR by hand.
      - name: Update flake.lock
        uses: DeterminateSystems/update-flake-lock@da03c0f078bc4b2c37ee4f7e072d34bf8f188bb3 # v29
        with:
          pr-title: 'chore(deps): update flake.lock'
          commit-msg: 'chore(deps): update flake.lock'
          pr-labels: dependencies
          pr-body: |
            Automated weekly update of `flake.lock` by the [update-flake-lock](https://github.com/DeterminateSystems/update-flake-lock) action.

            ```
            {{ env.GIT_COMMIT_MESSAGE }}
            ```

            The CI run on this PR validates the update (lint, tests and build inside the new dev shell). Review the run before merging.
