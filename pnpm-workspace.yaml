packages:
  - '.'

overrides:
  # Pinned exactly to 0.25.0 (1531760, "add esbuild override"; 0717a64 was an
  # "npm audit" lock refresh). Commits state no reason; most likely esbuild
  # <=0.24.2 dev-server advisory GHSA-67mh-4wv8-2f99 (inferred, not recorded).
  # Remove once vite/vitepress resolve a patched esbuild on their own.
  esbuild: '0.25.0'
  # VitePress 1.6.4 targets Vite 5; forcing Vite 6 is unsupported but works.
  # Added in 9a9cdd4 (dependency upgrade, no reason recorded; presumably Vite
  # advisories fixed only in 6.x, inferred). Also needed so vitest 5 shares one
  # vite. Remove when VitePress supports Vite 6+ natively.
  vite: '^6.4.5'
  # Forces one vitest version for both vitest and coverage-v8 (41803fb added
  # them, 9a9cdd4 added the override). Reason for the override is not recorded;
  # likely to keep the two in lockstep. Safe to drop if versions already match.
  vitest: '^5.0.5'
  # Keep in lockstep with vitest above (see 9a9cdd4).
  '@vitest/coverage-v8': '^5.0.5'
  # reason unknown (added in 9a9cdd4); likely a js-yaml advisory fix. Currently not in the dependency tree.
  js-yaml: '^4.3.2'
  # reason unknown (added in 9a9cdd4); likely a postcss advisory fix (pulled in by @vue/compiler-sfc via vue/vitepress).
  postcss: '^8.5.23'
  # reason unknown (added in 9a9cdd4); likely an advisory fix. Only reached via postcss.
  nanoid: '^3.3.19'
  # reason unknown (added in 9a9cdd4); likely an advisory fix. Only reached via eslint-plugin-vue.
  postcss-selector-parser: '^7.1.3'
  # reason unknown (added in 9a9cdd4); likely a brace-expansion ReDoS advisory fix for the 1.x line. Currently not in the tree.
  'brace-expansion@1': '^1.1.21'
  # reason unknown (added in 9a9cdd4); likely the same advisory fix for the 5.x line (used by minimatch 11 via ESLint).
  'brace-expansion@5': '^5.0.12'
  # GHSA-g3hv-75wg-m249 (moderate, via ESLint), added in ba6cedc; see TODO.md. Remove once ESLint's minimatch resolves to a patched version unaided.
  minimatch: '>=11.0.1'

allowBuilds:
  'esbuild': true
  '@esbuild/*': true
